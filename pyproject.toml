[project]
name = "pyvote"
version = "0.1.0"
description = "A Python library to simulate voting systems"
authors = [
    {name = "Romain Groux",email = "romaingroux@users.noreply.github.com"}
]
license = {text = "GNU"}
readme = "README.md"
requires-python = ">=3.12,<4.0"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
numpy = "^2.3.3"
pydantic = "2.12.4"


[tool.poetry.group.dev.dependencies]
bandit = "^1.8.6"
black = "^25.9.0"
mypy = "^1.18.2"
pytest = "^8.4.2"
pytest-cov = "^7.0.0"
docformatter = "^1.7.7"
ruff = "^0.14.9"
vulture = "^2.14"


[tool.black]
line-length = 88


[tool.isort]
combine_as_imports = true
include_trailing_comma = true


[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = true
ignore_missing_imports = true


[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

# Enable high-signal rules only
lint.select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "ARG",  # unused arguments
    "PL",   # pylint (selected rules)
]

# Avoid fighting Black
lint.ignore = [
    "E501",  # line length (Black handles it)
]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG"]


[tool.vulture]
min_confidence = 80


[tool.docformatter]
wrap-summaries = 88
wrap-descriptions = 88


[tool.poetry]
packages = [
    { include = "pyvote", from = "src" }
]